# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Builds the pkgdown site and publishes it to the gh-pages branch.
#
# Note for the maintainer: the site is currently served from the docs/ folder of the default branch, which is
# built and committed by hand. To let this workflow publish the site, set Settings > Pages > Source to the
# 'gh-pages' branch (root) after the first successful run; docs/ can then be removed from the repository.
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # the vignettes with evaluated chunks need DIAMOND
      - name: Install DIAMOND
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: orthologr-tools
          create-args: >-
            -c conda-forge -c bioconda
            diamond>=2.1
          cache-environment: true
          init-shell: none
          generate-run-shell: false

      - name: Put DIAMOND on the PATH
        shell: bash
        run: echo "$MAMBA_ROOT_PREFIX/envs/orthologr-tools/bin" >> "$GITHUB_PATH"

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
