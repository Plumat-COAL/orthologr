# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# The external programs the tests need are installed before the check, so that the tests that are skipped
# without them (DIAMOND: most of the suite; BLAST+; Clustal Omega, MAFFT, KaKs_Calculator) run:
#   Linux / macOS : from bioconda into a micromamba environment whose bin folder is put on the PATH
#   Windows       : DIAMOND from its GitHub release (bioconda has no Windows builds; the BLAST+ and
#                   alignment-program tests are skipped there)
#
# Triggers: pushes to the default branch and to the working branches of a fork (integration/**, upstream/**,
# upstream-v2/**, fix/**, chore/**), pull requests, and a manual start (Actions tab > R-CMD-check.yaml > "Run
# workflow"). Actions must be enabled in the repository settings of a fork for any of them to run.
#
# Supply chain: every action is pinned to the full commit SHA of a release (the release in the comment; update
# both together, e.g. with Dependabot or `git ls-remote --tags https://github.com/<owner>/<action>`). Every job
# and the long steps have a time limit. The DIAMOND release file that the Windows leg downloads is checked against
# a pinned SHA-256 checksum, the same as in R/diamond_install.R; the job 'diamond-checksums' compares the checksums
# pinned in R/diamond_install.R and here with the digests GitHub records for the release files and with a fresh
# download. The conda packages (micromamba) are verified by conda itself against the SHA-256 checksums of the
# channel's package index.
#
# The optional R package coalr (Suggests) is installed from the place named in the Remotes field of DESCRIPTION,
# pinned there to a commit of COAL (main 03612da, which has COAL #76), so that a change on COAL's default branch
# cannot change or break a check of this package; move the pin when a newer coalr is needed. The leg without
# optional tools removes coalr again, so that the routes without COAL (PAL2NAL as the default codon aligner, the
# errors that ask for COAL) are checked as well.
on:
  push:
    branches:
      - main
      - master
      - 'integration/**'
      - 'upstream/**'
      - 'upstream-v2/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 90

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}${{ matrix.config.tools == 'none' && ', no optional tools' || '' }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          # the oldest R that DESCRIPTION allows (Depends: R (>= 4.4.0)); oldrel-1 is newer
          - {os: ubuntu-latest,  r: '4.4'}
          # no optional tools: no DIAMOND, BLAST+, aligners, KaKs_Calculator (perl is on the runner) and no
          # coalr. Every test that needs one of them must skip; none may fail.
          - {os: ubuntu-latest,  r: 'release', tools: 'none'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # the tests that download the pinned DIAMOND release with diamond_install() and verify and run it
      # (tests/testthat/test-diamond_install.R); not on the leg without optional tools
      ORTHOLOGR_TEST_DIAMOND_DOWNLOAD: ${{ matrix.config.tools == 'none' && 'false' || 'true' }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install DIAMOND, BLAST+ and the optional programs (Linux, macOS)
        if: runner.os != 'Windows' && matrix.config.tools != 'none'
        timeout-minutes: 20
        uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2.0.7
        with:
          environment-name: orthologr-tools
          create-args: >-
            -c conda-forge -c bioconda
            diamond>=2.1
            blast
            clustalo
            mafft
            kakscalculator2
          cache-environment: true
          init-shell: none
          generate-run-shell: false

      - name: Put the programs on the PATH (Linux, macOS)
        if: runner.os != 'Windows' && matrix.config.tools != 'none'
        timeout-minutes: 2
        shell: bash
        run: |
          echo "$MAMBA_ROOT_PREFIX/envs/orthologr-tools/bin" >> "$GITHUB_PATH"

      - name: Install DIAMOND (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        env:
          # the pinned release and checksum of R/diamond_install.R (diamond_release_checksums())
          DIAMOND_URL: https://github.com/bbuchfink/diamond/releases/download/v2.2.8/diamond-windows.zip
          DIAMOND_SHA256: 8035ece14562e13576da6e9583c74ab1aaff9d0c96086d93ab337e95cd288ce1
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "diamond"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "diamond-windows.zip"
          Invoke-WebRequest -Uri $env:DIAMOND_URL -OutFile $zip -TimeoutSec 300
          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:DIAMOND_SHA256) { throw "SHA-256 of $env:DIAMOND_URL is $hash, expected $env:DIAMOND_SHA256" }
          Write-Output "SHA-256 verified: $hash"
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: Show the versions of the external programs
        timeout-minutes: 5
        shell: bash
        run: |
          if command -v diamond > /dev/null; then diamond version; else echo "no DIAMOND (leg without optional tools)"; fi
          perl -v | head -n 2
          if command -v blastp > /dev/null; then blastp -version; fi
          if command -v clustalo > /dev/null; then clustalo --version; fi
          if command -v mafft > /dev/null; then mafft --version; fi

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        timeout-minutes: 10

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        timeout-minutes: 15
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        timeout-minutes: 40
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Remove coalr (leg without optional tools)
        if: matrix.config.tools == 'none'
        timeout-minutes: 5
        shell: Rscript {0}
        run: |
          # (system.file() does not load the package: a loaded namespace would still be found afterwards)
          for (i in 1:3) if (nzchar(p <- system.file(package = "coalr"))) remove.packages("coalr", lib = dirname(p))
          stopifnot(!nzchar(system.file(package = "coalr")))

      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        timeout-minutes: 60
        env:
          # (without coalr, a suggested package, on the leg without optional tools)
          _R_CHECK_FORCE_SUGGESTS_: ${{ matrix.config.tools == 'none' && 'false' || 'true' }}
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # The SHA-256 checksums pinned for diamond_install() (R/diamond_install.R) and for the Windows leg above against
  # GitHub's record of the release files (the 'digest' of each asset in the REST API, computed by GitHub when the
  # file was uploaded) and against a fresh download of each file.
  diamond-checksums:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Compare the pinned checksums with GitHub's digests and with a download
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - R/diamond_install.R .github/workflows/R-CMD-check.yaml > pins.tsv <<'PY'
          import re, sys
          src = open(sys.argv[1]).read()
          body = src[src.index("diamond_release_checksums <- function()"):]
          body = body[:body.index("\n}\n")]
          def col(name):
              m = re.search(name + r"\s*=\s*c\(([^)]*)\)", body)
              return re.findall(r'"([^"]+)"', m.group(1))
          rows = list(zip(col("version"), col("asset"), col("sha256")))
          assert rows and all(re.fullmatch(r"[0-9a-f]{64}", r[2]) for r in rows), rows
          wf = open(sys.argv[2]).read()
          url = re.search(r"DIAMOND_URL: https://github.com/bbuchfink/diamond/releases/download/(\S+)/(\S+)", wf)
          sha = re.search(r"DIAMOND_SHA256: ([0-9a-f]{64})", wf).group(1)
          assert (url.group(1), url.group(2), sha) in rows, "the Windows leg's pin is not in R/diamond_install.R"
          for r in rows:
              print("\t".join(r))
          PY
          cat pins.tsv
          status=0
          while IFS=$'\t' read -r version asset sha; do
            digest=$(gh api "repos/bbuchfink/diamond/releases/tags/$version" \
                       --jq ".assets[] | select(.name == \"$asset\") | .digest")
            if [ -z "$digest" ] || [ "$digest" = "null" ]; then
              echo "::error::GitHub records no digest for $version/$asset"; status=1
            elif [ "$digest" != "sha256:$sha" ]; then
              echo "::error::$version/$asset: pinned $sha, GitHub $digest"; status=1
            else
              echo "$version/$asset: GitHub digest agrees"
            fi
            curl -fsSL --max-time 300 --retry 2 -o asset.bin \
              "https://github.com/bbuchfink/diamond/releases/download/$version/$asset"
            got=$(sha256sum asset.bin | cut -d' ' -f1)
            if [ "$got" != "$sha" ]; then
              echo "::error::$version/$asset: pinned $sha, downloaded $got"; status=1
            else
              echo "$version/$asset: download agrees"
            fi
          done < pins.tsv
          exit $status
